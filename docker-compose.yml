services:
  app-portal:
    image: ${CONTAINER_REGISTRY:-registry.example.com}/${IMAGE_NAME:-mingo-appliationportal}:latest
    build:
      context: .
    container_name: app-portal
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LiteDb__Path=/data/AppPortal.db
    volumes:
      - app-portal-data:/data
    restart: unless-stopped

volumes:
  app-portal-data:
